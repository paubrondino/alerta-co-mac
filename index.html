
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerta CO - MAC del dispositivo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f6fc;
      color: #17324d;
      text-align: center;
      padding: 40px 15px;
    }

    .card {
      max-width: 400px;
      margin: auto;
      padding: 30px 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px #0002;
    }

    h1 {
      color: #087eaa;
    }

    .mac {
      font-size: 21px;
      font-weight: bold;
      padding: 15px;
      background: #e5f4f9;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Alerta CO</h1>
    <p>MAC de tu dispositivo</p>
    <div class="mac">78:1c:3c:f5:80:cc</div>
  </div>
</body>
</html>
