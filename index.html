
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alerta CO</title>
    <style>
        body {
            background: #071426;
            color: white;
            font-family: Arial, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }
        main {
            background: #10243d;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            width: 80%;
            max-width: 360px;
        }
        h1 { color: #22d3ee; }
        .mac {
            background: #071426;
            padding: 15px;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <main>
        <h1>Alerta CO</h1>
        <p>Dirección MAC de tu dispositivo</p>
        <div class="mac">78:1C:3C:F5:80:CC</div>
    </main>
</body>
</html>
